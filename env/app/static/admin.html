<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShortPass · 管理台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="title">ShortPass 管理台</div>
      <div class="meta" id="clock"></div>
    </div>
    <div class="row" style="max-width:420px">
      <input id="token" type="password" placeholder="管理员令牌 (PASSPORT_ADMIN_TOKEN)">
      <button class="btn primary" id="saveToken">保存</button>
    </div>
  </div>

  <div class="card">
    <div class="pill-row" id="stats"></div>
  </div>

  <div class="grid" style="margin-top:16px">
    <!-- 左栏：操作 -->
    <div>
      <div class="card">
        <h2>签发通行票</h2>
        <label>人员标识（身份证/工号/手机号等）</label>
        <input id="f-person" placeholder="例如 V-10086">
        <div class="row">
          <div>
            <label>生效时间（留空=立即）</label>
            <input id="f-from" type="datetime-local">
          </div>
          <div>
            <label>有效期（分钟）</label>
            <input id="f-min" type="number" min="1" value="60">
          </div>
        </div>
        <label>备注</label>
        <input id="f-note" placeholder="可选">
        <label>允许通行的分区（不勾选 = 所有门点拒绝）</label>
        <div id="f-zones" class="zone-box"><span class="muted">加载中…</span></div>
        <label>绑定检查路线（可选；绑定时分区须包含路线所属分区）</label>
        <select id="f-route"><option value="">不绑定路线</option></select>
        <button class="btn primary" id="btn-issue" style="margin-top:12px;width:100%">发票</button>
        <div id="issue-result"></div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>访客预约批次</h2>
        <label>批次名称（可选）</label>
        <input id="b-name" placeholder="例如 供应商参观-上午场">
        <div class="row">
          <div>
            <label>访问日期</label>
            <input id="b-date" type="date">
          </div>
          <div>
            <label>人数上限（含同行人）</label>
            <input id="b-cap" type="number" min="1" value="10">
          </div>
        </div>
        <div class="row">
          <div>
            <label>时段开始</label>
            <input id="b-start" type="datetime-local">
          </div>
          <div>
            <label>时段结束</label>
            <input id="b-end" type="datetime-local">
          </div>
        </div>
        <label>所属分区（审核通过后签发的票仅允许该分区）</label>
        <select id="b-zone"></select>
        <label>绑定检查路线（可选；审核签票时固化当前版本）</label>
        <select id="b-route"><option value="">不绑定路线</option></select>
        <button class="btn primary" id="btn-batch" style="margin-top:12px;width:100%">创建批次</button>
        <div class="section" id="batches"></div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>按票面编号作废</h2>
        <label>票面编号</label>
        <input id="r-code" class="mono" placeholder="T-XXXXXXXX">
        <label>作废原因</label>
        <input id="r-reason" value="admin_revoke">
        <button class="btn danger" id="btn-revoke" style="margin-top:12px;width:100%">作废该票（其他票不受影响）</button>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>访客路线编排</h2>
        <div class="row">
          <input id="rt-id" placeholder="路线 ID（留空自动）">
          <input id="rt-name" placeholder="路线名称，如 供应商参观线">
          <select id="rt-zone"></select>
        </div>
        <button class="btn primary" id="btn-route-create" style="margin-top:8px;width:100%">创建路线</button>
        <div class="section" id="rt-list"></div>

        <h2 style="margin-top:18px">发布新版本（替换未来使用）</h2>
        <div class="row">
          <select id="rtv-route" style="flex:1"><option value="">选择路线…</option></select>
        </div>
        <div class="muted" style="font-size:12px;margin:6px 0">
          按顺序添加检查点（门点 + 该点最长停留秒数，留空=不限）；发布后版本内容不可变，在途访客继续走旧版本。
        </div>
        <div id="rtv-cps"></div>
        <div class="row">
          <button class="btn" id="btn-rtv-add" type="button">+ 检查点</button>
          <input id="rtv-note" placeholder="版本说明（可选）" style="flex:1">
        </div>
        <button class="btn primary" id="btn-rtv-publish" style="margin-top:8px;width:100%">发布新版本</button>
        <div id="rtv-result" class="section"></div>

        <h2 style="margin-top:18px">检查点开/闭 · 暂停/恢复 · 绑定</h2>
        <div class="row">
          <select id="rta-route" style="flex:1"><option value="">路线…</option></select>
        </div>
        <div class="row">
          <input id="rta-seq" type="number" min="1" placeholder="检查点顺序#" style="max-width:130px">
          <input id="rta-version" type="number" min="1" placeholder="版本(默认当前)" style="max-width:130px">
          <button class="btn danger" id="btn-rta-close">关闭</button>
          <button class="btn" id="btn-rta-open">打开</button>
        </div>
        <div class="row">
          <button class="btn danger" id="btn-rta-pause">暂停路线</button>
          <button class="btn primary" id="btn-rta-resume">恢复路线</button>
        </div>
        <div class="row">
          <select id="rta-scope">
            <option value="TICKET">绑定到票</option>
            <option value="BATCH">绑定到批次</option>
          </select>
          <input id="rta-target" placeholder="票面编号 或 批次 ID" style="flex:1">
          <button class="btn primary" id="btn-rta-bind">绑定</button>
        </div>
        <div id="rta-result" class="section"></div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>门点管理</h2>
        <div class="row">
          <input id="g-id" placeholder="门点 ID，如 gate-east">
          <input id="g-name" placeholder="名称，如 东门">
        </div>
        <button class="btn primary" id="btn-gate" style="margin-top:10px;width:100%">注册门点</button>
        <div class="section" id="gates"></div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>分区与紧急封锁</h2>
        <div class="row">
          <input id="z-id" placeholder="分区 ID，如 Z-A">
          <input id="z-name" placeholder="名称，如 A 区">
        </div>
        <button class="btn primary" id="btn-zone" style="margin-top:10px;width:100%">创建分区</button>
        <div class="section" id="zones"></div>

        <h2 style="margin-top:18px">发布封锁规则（带版本号）</h2>
        <div class="row">
          <select id="pr-action">
            <option value="LOCK">紧急封锁</option>
            <option value="UNLOCK">解除封锁</option>
          </select>
          <select id="pr-zone"><option value="">全局（所有分区）</option></select>
        </div>
        <label>规则 ID（留空自动生成；重复发布同一 ID 不重复生效）</label>
        <input id="pr-rule" class="mono" placeholder="例如 LOCK-20260912-01">
        <label>原因</label>
        <input id="pr-reason" placeholder="例如 消防演练 / 安保事件">
        <button class="btn danger" id="btn-publish" style="margin-top:10px;width:100%">发布规则</button>
        <div class="section" id="rules"></div>
      </div>
    </div>

    <!-- 右栏：查询 -->
    <div>
      <div class="card">
        <div class="tabs">
          <button data-tab="routes" class="btn active">路线监控</button>
          <button data-tab="presence" class="btn">在场清册</button>
          <button data-tab="rollcall" class="btn">应急清点</button>
          <button data-tab="batch" class="btn">预约批次</button>
          <button data-tab="person" class="btn">按人查看</button>
          <button data-tab="ticket" class="btn">按票查看</button>
          <button data-tab="zone" class="btn">按分区查看</button>
          <button data-tab="events" class="btn">状态流水</button>
          <button data-tab="attempts" class="btn">门点记录</button>
        </div>

        <div id="tab-routes">
          <div class="pill-row" id="rt-summary"></div>
          <div class="row">
            <select id="rm-status">
              <option value="">全部执行</option>
              <option value="IN_PROGRESS" selected>进行中</option>
              <option value="COMPLETED">已完成</option>
              <option value="VIOLATED">违规历史</option>
            </select>
            <select id="rm-route"><option value="">全部路线</option></select>
            <select id="rm-zone"><option value="">全部分区</option></select>
          </div>
          <div class="row">
            <select id="rm-batch"><option value="">全部批次</option></select>
            <input id="rm-person" placeholder="按人员标识过滤" style="max-width:160px">
            <label style="font-size:12px"><input type="checkbox" id="rm-overdue"> 仅超时停留</label>
            <button class="btn primary" id="btn-rm">刷新</button>
          </div>
          <div class="section" id="rm-list"></div>
          <div class="section" id="rm-detail"></div>
          <h2>离线冲突队列（需管理员处理）</h2>
          <div class="row">
            <select id="rc-status">
              <option value="OPEN" selected>待处理</option>
              <option value="ALL">全部</option>
              <option value="RESOLVED">已处理</option>
            </select>
            <button class="btn primary" id="btn-rc">刷新冲突</button>
          </div>
          <div class="section" id="rc-list"></div>
        </div>

        <div id="tab-presence" hidden>
          <div class="row">
            <select id="pr-view">
              <option value="onsite">当前在场</option>
              <option value="unconfirmed">未确认离场</option>
              <option value="departed">已离场</option>
              <option value="removed">误扫移除</option>
              <option value="all">全部</option>
            </select>
            <select id="pr-zone"><option value="">全部分区</option></select>
            <select id="pr-batch"><option value="">全部批次</option></select>
          </div>
          <div class="row">
            <input id="pr-q" placeholder="按票号/申请人/人员标识过滤">
            <button class="btn primary" id="btn-pr">刷新清册</button>
          </div>
          <div class="pill-row" id="pr-summary"></div>
          <div class="section" id="pr-list"></div>
          <div class="section" id="pr-detail"></div>
        </div>

        <div id="tab-rollcall" hidden>
          <div class="row">
            <input id="rc-reason" placeholder="清点原因（如：消防演练/安保事件）" style="flex:1">
            <select id="rc-zone"><option value="">全部分区</option></select>
            <select id="rc-batch"><option value="">全部批次</option></select>
            <button class="btn danger" id="btn-rollcall">发起应急清点（生成不可变快照）</button>
          </div>
          <div class="row">
            <select id="rc-list"><option value="">历史快照…</option></select>
            <button class="btn primary" id="btn-rc-view">查看快照</button>
          </div>
          <div class="section" id="rc-detail"><p class="muted">快照固定发起瞬间的在场人员、同行名单、批次分区与最后门点；之后到场/离场/更正不会改写旧快照。</p></div>
        </div>

        <div id="tab-batch" hidden>
          <div class="row">
            <select id="bv-batch"></select>
            <button class="btn primary" id="btn-batchview">查看批次</button>
          </div>
          <div class="section" id="bv-detail"></div>
        </div>

        <div id="tab-person" hidden>
          <div class="row">
            <input id="p-q" placeholder="人员标识（支持模糊）">
            <button class="btn primary" id="btn-ps">搜索</button>
            <button class="btn" id="btn-p-all">全部</button>
          </div>
          <div class="section" id="p-list"></div>
          <div class="section" id="p-detail"></div>
        </div>

        <div id="tab-ticket" hidden>
          <div class="row">
            <input id="t-code" class="mono" placeholder="T-XXXXXXXX">
            <button class="btn primary" id="btn-ticket">查询</button>
          </div>
          <div class="section" id="t-detail"></div>
        </div>

        <div id="tab-zone" hidden>
          <div class="row">
            <select id="zv-zone"></select>
            <button class="btn primary" id="btn-zoneview">查看分区</button>
          </div>
          <div class="section" id="zv-detail"></div>
        </div>

        <div id="tab-events" hidden>
          <div class="row">
            <input id="e-filter" placeholder="按票面编号或人员标识过滤（可选）">
            <button class="btn primary" id="btn-events">刷新流水</button>
          </div>
          <div class="section"><table id="e-table"><thead>
            <tr><th>版本</th><th>时间</th><th>类型</th><th>票号</th><th>人</th><th>门点</th><th>原因</th></tr>
          </thead><tbody></tbody></table></div>
        </div>

        <div id="tab-attempts" hidden>
          <div class="row">
            <select id="a-gate"><option value="">全部门点</option></select>
            <button class="btn primary" id="btn-attempts">刷新记录</button>
          </div>
          <div class="section"><table id="a-table"><thead>
            <tr><th>时间</th><th>门点</th><th>票号</th><th>结果</th><th>状态</th><th>HTTP</th><th>attempt_id</th></tr>
          </thead><tbody></tbody></table></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/static/common.js"></script>
<script src="/static/admin.js"></script>
</body>
</html>
