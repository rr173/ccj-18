<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShortPass · 访客预约申请</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="center">
<main class="card landing" style="width:520px">
  <h1>访客预约申请</h1>
  <p class="sub" id="sub">正在读取批次信息…</p>

  <div id="batch-info"></div>

  <form id="apply-form">
    <label>姓名</label>
    <input id="f-name" maxlength="128" placeholder="与证件一致的姓名" required>
    <label>联系方式（手机号 / 邮箱）</label>
    <input id="f-contact" maxlength="128" placeholder="用于审核联络" required>
    <label>同行人数（不含本人，0 = 独自到访）</label>
    <input id="f-companions" type="number" min="0" max="1000" value="0" required>
    <div id="f-names-wrap"></div>
    <p class="hint">名额按“本人 + 同行人数”整组占用；满额时将自动进入按提交时间排序的候补队列。
      请填写每位同行人姓名供门点核对。请不要重复提交，本页对网络重试自动幂等。</p>
    <button class="btn primary big" type="submit" style="width:100%;margin-top:8px">提交申请</button>
  </form>

  <div id="result"></div>

  <div class="section" id="my-apps-section" hidden>
    <h2>我在本批次的申请</h2>
    <div id="my-apps"></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script src="/static/common.js"></script>
<script src="/static/apply.js"></script>
</body>
</html>
