services:
  shortpass:
    build: .
    image: shortpass:latest
    container_name: shortpass
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 生产部署务必修改这两个令牌
      PASSPORT_ADMIN_TOKEN: "${PASSPORT_ADMIN_TOKEN:-please-change-admin-token}"
      PASSPORT_GATE_TOKEN: "${PASSPORT_GATE_TOKEN:-please-change-gate-token}"
      PASSPORT_SWEEP_INTERVAL: "10"
    volumes:
      - shortpass-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  shortpass-data:
